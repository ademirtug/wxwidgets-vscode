name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  native:
    name: Native application (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ gdb libwxgtk3.2-dev xvfb xauth
      - name: Install macOS development dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja wxwidgets
      - run: npm ci --ignore-scripts
      - name: Build and run Debug and Release on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native -- --run
      - name: Build Debug and Release macOS bundles
        if: runner.os == 'macOS'
        run: |
          export WX_CONFIG="$(brew --prefix wxwidgets)/bin/wx-config"
          npm run test:native

  package:
    name: Package extension
    needs: [unit, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: wxwidgets-tools
          path: dist/wxwidgets-tools.vsix
